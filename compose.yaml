name: dcdash

x-backend-env: &backend-env
  DCDASH_DATABASE_URL: postgresql://dcdash:${DCDASH_DB_PASSWORD}@db:5432/dcdash
  DCDASH_SECRET_KEY: ${DCDASH_SECRET_KEY}
  DCDASH_TIMEZONE: ${DCDASH_TIMEZONE:-UTC}
  DCDASH_SCAN_MAX_HOSTS: ${DCDASH_SCAN_MAX_HOSTS:-1024}
  DCDASH_SCAN_EXTRA_PORTS: ${DCDASH_SCAN_EXTRA_PORTS:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: dcdash
      POSTGRES_PASSWORD: ${DCDASH_DB_PASSWORD}
      POSTGRES_DB: dcdash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcdash -d dcdash"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: dcdash-backend:local
    restart: unless-stopped
    logging: *default-logging
    command: sh -c "alembic upgrade head && exec uvicorn dcdash.api.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"
    stop_grace_period: 15s
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dcdash-web:local
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DCDASH_TLS_CERT: ${DCDASH_TLS_CERT:-}
      DCDASH_TLS_KEY: ${DCDASH_TLS_KEY:-}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Caddy's admin endpoint answers in HTTP and in TLS mode (port 80 only redirects in TLS mode); the file proves the UI is baked in.
      test: ["CMD-SHELL", "test -f /srv/index.html && wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  collector:
    build: ./backend
    image: dcdash-backend:local
    restart: unless-stopped
    logging: *default-logging
    command: python -m dcdash.collector.main
    stop_grace_period: 20s
    environment: *backend-env
    volumes:
      - ./certs:/certs:ro          # OPC UA client certificate for basic256sha256 (see README)
    depends_on:
      api:
        condition: service_healthy

  simulator:
    build: ./backend
    image: dcdash-backend:local
    profiles: [dev]
    restart: unless-stopped
    logging: *default-logging
    command: python -m dcdash.simulator.main
    environment:
      SIM_API_KEY: sim-key
      SIM_OPCUA_PASSWORD: ${SIM_OPCUA_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:4840:4840"
      - "127.0.0.1:5020:5020"

volumes:
  dbdata: {}

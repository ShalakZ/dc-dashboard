name: dcdash

x-backend-env: &backend-env
  DCDASH_DATABASE_URL: postgresql://dcdash:${DCDASH_DB_PASSWORD}@db:5432/dcdash
  DCDASH_SECRET_KEY: ${DCDASH_SECRET_KEY}
  DCDASH_TIMEZONE: ${DCDASH_TIMEZONE:-UTC}
  DCDASH_SCAN_MAX_HOSTS: ${DCDASH_SCAN_MAX_HOSTS:-1024}
  DCDASH_SCAN_EXTRA_PORTS: ${DCDASH_SCAN_EXTRA_PORTS:-}
  DCDASH_TLS_CERT: ${DCDASH_TLS_CERT:-}
  DCDASH_FIGURE_LEDGER: ${DCDASH_FIGURE_LEDGER:-1}
  DCDASH_FIGURES_INTERVAL: ${DCDASH_FIGURES_INTERVAL:-30}
  DCDASH_FIGURES_MONTHS: ${DCDASH_FIGURES_MONTHS:-6}

# api, collector, figures and simulator build the same image (dcdash-backend:local), so they must pass the same arguments. The build id comes from
# scripts/setup.sh, setup.ps1 and e2e.sh (the commit and its commit time); a hand-typed build without them says dev / unknown.
x-backend-build: &backend-build
  context: ./backend
  args:
    DCDASH_BUILD_ID: ${DCDASH_BUILD_ID:-dev}
    DCDASH_BUILD_TIME: ${DCDASH_BUILD_TIME:-unknown}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: dcdash
      POSTGRES_PASSWORD: ${DCDASH_DB_PASSWORD}
      POSTGRES_DB: dcdash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcdash -d dcdash"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: *backend-build
    image: dcdash-backend:local
    restart: unless-stopped
    logging: *default-logging
    command: sh -c "alembic upgrade head && exec uvicorn dcdash.api.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"
    stop_grace_period: 15s
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dcdash-web:local
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DCDASH_TLS_CERT: ${DCDASH_TLS_CERT:-}
      DCDASH_TLS_KEY: ${DCDASH_TLS_KEY:-}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Caddy's admin endpoint answers in HTTP and in TLS mode (port 80 only redirects in TLS mode); the file proves the UI is baked in.
      test: ["CMD-SHELL", "test -f /srv/index.html && wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  collector:
    build: *backend-build
    image: dcdash-backend:local
    restart: unless-stopped
    logging: *default-logging
    command: python -m dcdash.collector.main
    stop_grace_period: 20s
    environment: *backend-env
    volumes:
      - ./certs:/certs:ro          # OPC UA client certificate for basic256sha256 (see docs/sources-and-discovery.md)
    depends_on:
      api:
        condition: service_healthy

  # Derived figures only (w26b): it keeps the figure ledger current in the background. Stopping it makes things slower, never wrong.
  figures:
    build: *backend-build
    image: dcdash-backend:local
    restart: unless-stopped
    logging: *default-logging
    command: python -m dcdash.figures
    stop_grace_period: 20s
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The worker touches this file after every target and every cycle (an idle standby too); older than 3 minutes means stuck.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/figures.heartbeat') < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  simulator:
    build: *backend-build
    image: dcdash-backend:local
    profiles: [dev]
    restart: unless-stopped
    logging: *default-logging
    command: python -m dcdash.simulator.main
    environment:
      SIM_API_KEY: sim-key
      SIM_OPCUA_PASSWORD: ${SIM_OPCUA_PASSWORD:-}
      # Fault injection for rehearsing the field-debugging loop (docs/field-debugging.md): OPC UA only, off unless set for ONE
      # command (`SIM_FAULT_SLOW=1.5 docker compose --profile dev up -d simulator`), never in .env. Only this dev-profile service
      # gets them; backend/dcdash/simulator/faults.py is the only reader and refuses a name it does not know.
      SIM_FAULT_POLICIES: ${SIM_FAULT_POLICIES:-}
      SIM_FAULT_UNTRUSTED_CERT: ${SIM_FAULT_UNTRUSTED_CERT:-}
      SIM_FAULT_AUTH: ${SIM_FAULT_AUTH:-}
      SIM_FAULT_SLOW: ${SIM_FAULT_SLOW:-}
      SIM_FAULT_DROP: ${SIM_FAULT_DROP:-}
      SIM_FAULT_BAD: ${SIM_FAULT_BAD:-}
      SIM_FAULT_SKEW: ${SIM_FAULT_SKEW:-}
      SIM_FAULT_CERT_HOSTS: ${SIM_FAULT_CERT_HOSTS:-}
      # The stand-in Historian (w30): a second HTTP server of this simulator, port 9100, that answers history so the backfill can be
      # rehearsed without a real Historian. These are its switches (how many meters, and three faults); empty means the default. Dev
      # profile only, like the line above; backend/dcdash/simulator/historian.py is the only reader and refuses a name it does not know.
      SIM_HISTORIAN_PORT: ${SIM_HISTORIAN_PORT:-}
      SIM_HISTORIAN_METERS: ${SIM_HISTORIAN_METERS:-}
      SIM_HISTORIAN_MAX_ROWS: ${SIM_HISTORIAN_MAX_ROWS:-}
      SIM_HISTORIAN_LATE_MINUTES: ${SIM_HISTORIAN_LATE_MINUTES:-}
      SIM_HISTORIAN_ZONE: ${SIM_HISTORIAN_ZONE:-}
      SIM_HISTORIAN_FAIL_EVERY: ${SIM_HISTORIAN_FAIL_EVERY:-}
      SIM_HISTORIAN_RATE: ${SIM_HISTORIAN_RATE:-}
      SIM_HISTORIAN_SLOW: ${SIM_HISTORIAN_SLOW:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:4840:4840"
      - "127.0.0.1:5020:5020"
      - "127.0.0.1:9100:9100"

volumes:
  dbdata: {}
